<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ESPN Draft Buddy</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="wrap">
    <h1>ESPN Draft Buddy</h1>
    <p id="status-line" class="status">Checking status…</p>

    <button id="toggle-overlay-btn" type="button" class="primary">Show/Hide overlay</button>
    <button id="reset-draft-btn" type="button" class="secondary">Reset draft</button>
    <button id="open-options-btn" type="button" class="secondary">Import rankings…</button>

    <p class="hint">Open a live ESPN fantasy football draft room to see the overlay panel.</p>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
